<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Caça Achadinhos</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body {
  background: linear-gradient(180deg, #ff7ab8, #ff9ccc);
  font-family: Arial, sans-serif;
  color: white;
  text-align: center;
  margin: 0;
}
.box {
  max-width: 420px;
  margin: auto;
  padding: 30px 20px;
}
.logo img {
  width: 160px;
  margin-bottom: 10px;
}
h1 {
  font-size: 32px;
  margin: 5px 0;
}
p {
  font-size: 16px;
  margin-bottom: 25px;
}
button {
  width: 100%;
  padding: 18px;
  margin: 12px 0;
  border: none;
  border-radius: 22px;
  font-size: 18px;
  font-weight: bold;
  cursor: pointer;
}
.shopee { background: #ffffff; color: #ff3b8b; }
.shein { background: #ffd3e6; color: #ff3b8b; }
.amazon { background: #ffffff; color: #ff3b8b; }
.promos { background: #ff3b8b; color: #ffffff; }

.footer {
  font-size: 12px;
  opacity: 0.9;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="box">

  <!-- LOGO -->
  <div class="logo">
    <img src="logo.png" alt="Caça Achadinhos">
  </div>

  <h1>Caça Achadinhos</h1>
  <p>Achadinhos bons, baratos e que valem a pena 💸✨</p>

  <button class="shopee"
    onclick="location.href='https://shopee.com.br/?affiliate_id=18388370476'">
    🔥 Shopee – Achadinhos
  </button>

  <button class="shein"
    onclick="location.href='https://www.shein.com/?ref=KZ66C'">
    💖 Shein – Ofertas
  </button>

  <button class="amazon"
    onclick="location.href='https://www.amazon.com.br/?tag=alanaeugenio-20'">
    ⚡ Amazon – Promoções
  </button>

  <button class="promos"
    onclick="location.href='https://shopee.com.br/?affiliate_id=18388370476'">
    🚨 Promoções do Dia
  </button>

  <div class="footer">
    *Links de afiliado – posso receber comissão pelas compras.
  </div>

</div>
</body>
</html>
